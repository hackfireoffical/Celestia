# Celestia Mobile — Iris shader configuration
oldLighting=false
underwaterOverlay=true
vignette=false
sun=true
moon=true
shadowMapResolution=1024
shadowDistance=64.0
shadowIntervalSize=2.0
shadowHardwareFiltering=true
shadow.enabled=true
shadow.culling=true
shadowEntities=true
shadowBlockEntities=true
separateAo=true

# Keep every discovered option visible on the main settings page.
screen = <profile> *
sliders = CLOUD_AMOUNT CLOUD_SPEED SKY_GLOW STAR_DENSITY SHADOW_STRENGTH SUN_DIRECTIONAL MIN_LIGHT GODRAY_STRENGTH BLOOM_STRENGTH BLOOM_THRESHOLD

profile.LOW = CLOUD_MODE=1 CLOUD_QUALITY=1 SHADOWS SHADOW_QUALITY=0 SHADOW_STRENGTH=0.65 !GODRAYS GODRAY_STRENGTH=0.0 BLOOM BLOOM_STRENGTH=0.12
profile.MEDIUM = CLOUD_MODE=1 CLOUD_QUALITY=2 SHADOWS SHADOW_QUALITY=1 SHADOW_STRENGTH=0.85 GODRAYS GODRAY_STRENGTH=0.4 BLOOM BLOOM_STRENGTH=0.22
profile.HIGH = CLOUD_MODE=1 CLOUD_QUALITY=3 SHADOWS SHADOW_QUALITY=2 SHADOW_STRENGTH=1.0 GODRAYS GODRAY_STRENGTH=0.7 BLOOM BLOOM_STRENGTH=0.35
